version: '3.8'

services:
  backend:
    build:
      context: ./bitforce--backend
      dockerfile: Dockerfile
    container_name: bitforce_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./bitforce--backend/.env
    environment:
      - PORT=8000
    networks:
      - bitforce_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitforce_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bitforce_net

networks:
  bitforce_net:
    driver: bridge
